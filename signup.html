<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="signup.css">
  <script src="https://kit.fontawesome.com/429a18313f.js" crossorigin="anonymous"></script>
</head>
<body>


<div class="container">

  <!-- LEFT FORM -->
  <div class="left">
    <div class="form-box">
      <h2>SIGN UP</h2>
      <p class="desc">Create your account by filling the details below</p>

<div class="input-box">
  <input type="text" placeholder="Full Name">
</div>

<div class="input-box">
  <input type="email" placeholder="Email">
</div>

<div class="input-box">
  <input type="text" placeholder="Username">
</div>

<div class="input-box">
  <input type="password" placeholder="Password">
</div>

<div class="input-box">
  <input type="password" placeholder="Confirm Password">
</div>

      <button>SIGN UP</button>

      <p class="signup">
        Already have an account?
        <a href="signin.html">sign in</a>
      </p>
    </div>
  </div>

  <!-- RIGHT IMAGE -->
  <div class="right">
    <div class="overlay">
      <h1>Lumeo</h1>
    </div>
  </div>

</div>
    
</body>
</html>
