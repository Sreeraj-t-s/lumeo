<html lang="en">
<head>

    <title>sign in</title>
    <link rel="stylesheet" href="signin.css">
  <script src="https://kit.fontawesome.com/429a18313f.js" crossorigin="anonymous"></script>
</head>
<body>
    
<div class="container">

  <!-- LEFT IMAGE -->
  <div class="left">
    <div class="overlay">
      <h1>Lumeo</h1>
    </div>
  </div>

  <!-- RIGHT FORM -->
  <div class="right">
    <div class="form-box">
      <h2>SIGN IN</h2>

      <div class="input-box">
        <input type="text" placeholder="Username">
      </div>

      <div class="input-box">
        <input  type="password" placeholder="Password" >
      </div>

      <p class="forgot">Forgot Password?</p>

      <button>SIGN IN</button>
      <p class="signup">Don't have an account?<a href="signup.html">  sign up</a></p>
    </div>
  </div>

</div>
